<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Song & Animation</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <h1>Welcome to My Favorite Song Page</h1>
    <p>Enjoy a great track embedded straight from YouTube below!</p>

    <!-- Requirement 1: Embedded YouTube music video -->
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=WCCTKQT6g6WbkMFS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <hr class="divider">

    <h2>JavaScript Animation Demo</h2>
    <p>Click the button to watch the box animate across the screen!</p>
    
    <!-- Button to trigger the animation -->
    <button onclick="startAnimation()">Start Animation</button>

    <!-- The animated element -->
    <div id="animatedBox"></div>

    <!-- Link to the external JavaScript file -->
    <script src="JS/script.js"></script>

</body>
</html>
